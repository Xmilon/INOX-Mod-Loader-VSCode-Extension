# An API mod for Horizon (docs/native-mods.md, "API mods"): no mixin, only the crate below, which the
# game calls after its hook points. Changing it rebuilds in seconds, without recompiling horizon-client.
[mod]
id = "{id}"
version = "0.1.0"

[compatibility]
# The Horizon commit this mod was made for (40 hex digits): needed to build the .hnmod.
horizon_revision = "{revision}"

[api]
crate = "engine"
entry = "create"

[[crate]]
id = "engine"
path = "engine"
