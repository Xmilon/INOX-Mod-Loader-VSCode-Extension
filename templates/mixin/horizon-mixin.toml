# A mixin mod for Horizon (docs/native-mods.md): code injected into the game at its hook points.
# Building it recompiles horizon-client; an API mod ([api]) doesn't.
[mod]
id = "{id}"
version = "0.1.0"

[compatibility]
# The Horizon commit this mod was made for (40 hex digits): needed to build the .hnmod.
horizon_revision = "{revision}"

# The hook point by its name in native-hooks.json (autocompleted), not its path in the source.
[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]
